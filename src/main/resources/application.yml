# 애플리케이션 설정
server:
  port: 8095

spring:
  application:
    name: sidebar-backend
  cache:
    type: simple
  main:
    web-application-type: servlet

logging:
  level:
    # org.springframework: DEBUG
    com.sidebeam: DEBUG

# GitLab 설정
gitlab:
  # GitLab API URL (예: https://gitlab.com)
  api-url: https://gitlab.com
  # read_repository 권한을 가진 개인 액세스 토큰
  access-token: ${GITLAB_ACCESS_TOKEN:}
  # 모든 하위 그룹과 프로젝트를 가져올 루트 그룹 ID
  root-group-id: ${GITLAB_ROOT_GROUP_ID:}
  # 데이터를 가져올 브랜치 이름
  branch: ${GITLAB_BRANCH:main}
  # 저장소 내 북마크 데이터 디렉토리 경로
  # 이 경로는 sidebeam-data가 아닌 다른 저장소에 사용됩니다
  # sidebeam-data 저장소의 경우 경로는 코드에서 처리됩니다
  bookmark-data-path: sidebar-data/bookmark-data
  # 찾을 파일 확장자
  included-file-extensions:
    - '.yml'
    - '.yaml'
  excluded-filenames:
    - '.gitlab-ci.yml'
  api:
    config: classpath:/gitlab/gitlab-api.yml

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    url: /api-docs        # ✅ 이 설정만 유지

# 캐시 설정
cache:
  # 북마크 데이터 캐싱 활성화
  enabled: true
  # 캐시 생존 시간(초) (기본값: 1시간)
  ttl: 3600

# 검증 설정
validation:
  # 스키마 검증 설정
  schema:
    # JSON 스키마 파일 경로 (클래스패스 기준)
    bookmark-schema-path: bookmark-schema/bookmark.schema.json
    # 스키마 검증 활성화 여부
    enabled: true
    # 엄격한 검증 모드 (true: 검증 실패 시 예외 발생, false: 로그만 출력)
    strict: false
  # 중복 검증 설정
  duplicate:
    # 중복 URL 검증 활성화 여부
    enabled: true
    # 엄격한 검증 모드 (true: 검증 실패 시 예외 발생, false: 로그만 출력)
    strict: false

# 웹훅 설정
webhook:
  # GitLab 웹훅 검증을 위한 비밀 토큰
  secret-token: ${WEBHOOK_SECRET_TOKEN:your-webhook-secret}
